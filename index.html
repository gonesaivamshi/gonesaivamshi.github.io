<!DOCTYPE html>
<html>
<head>
    <title>My Love ❤️</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        .scroll {
            position: absolute;
            white-space: nowrap;
            animation: move 8s linear infinite;
            color: red;
            font-size: 50px;
            font-weight: bold;
            text-shadow: 0 0 10px red, 0 0 25px darkred;
        }

        @keyframes move {
            from {
                transform: translateX(100vw);
            }

            to {
                transform: translateX(-100%);
            }
        }
    </style>
</head>

<body>

    <div class="scroll">
        🩸❤️ I LOVE YOU MANVITHA ❤️🩸
        &nbsp;&nbsp;&nbsp;
        🩸❤️ I LOVE YOU BANGARAM ❤️🩸
    </div>

</body>
</html>
